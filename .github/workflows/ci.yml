# SPDX-License-Identifier: Apache-2.0
name: core-ci

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'ros1/**'
      - 'ros2/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-20-04-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Ubuntu 20.04 image
        run: docker build --file ci/Dockerfile.ubuntu20.04 --tag wheeltec-vcu-focal-ci .
      - name: Run core, PTY, sanitizer, install, and Python checks
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --env HOME=/tmp
          --volume "${GITHUB_WORKSPACE}:/workspace"
          wheeltec-vcu-focal-ci
          bash ci/run_ci.sh
