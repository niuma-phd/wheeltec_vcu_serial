# SPDX-License-Identifier: Apache-2.0
name: ros2-humble-ci

on:
  workflow_dispatch:
  push:
    branches:
      - 'ros2/humble'
  pull_request:
    branches:
      - 'ros2/humble'

permissions:
  contents: read

concurrency:
  group: ros2-humble-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humble-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pull immutable ROS 2 Humble environment
        run: >-
          docker pull
          ros:humble-ros-base-jammy@sha256:7bea3d9aa2483d3ca34c8e30d921b79273b0913bd7dc64bebf51d082b5d107e4
      - name: Install core, build and test adapter, smoke-test offline launch
        run: >-
          docker run --rm
          --read-only
          --network none
          --cap-drop ALL
          --security-opt no-new-privileges
          --user "$(id -u):$(id -g)"
          --tmpfs /tmp:exec,mode=1777
          --env HOME=/tmp
          --volume "${GITHUB_WORKSPACE}:/workspace:ro"
          --workdir /workspace
          ros:humble-ros-base-jammy@sha256:7bea3d9aa2483d3ca34c8e30d921b79273b0913bd7dc64bebf51d082b5d107e4
          bash ros2/ci/run_ci.sh
