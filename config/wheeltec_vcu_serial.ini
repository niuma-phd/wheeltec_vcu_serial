# SPDX-License-Identifier: Apache-2.0
# Example only. These values are not a hardware capability or safety approval.

[serial]
# Intentionally empty: a physical device must be selected by the operator.
device =
reconnect_interval_ms = 1000

[limits]
# Explicit conservative example. The library has no 0.50 m/s built-in ceiling.
max_linear_speed_mps = 0.30
max_abs_yaw_rate_radps = 1.00

[watchdog]
command_timeout_ms = 250
feedback_timeout_ms = 200
transmit_period_ms = 20
fresh_commands_required = 3
write_timeout_ms = 10
zero_retry_interval_ms = 20
zero_retry_attempts = 3

[teleop]
min_selected_speed_mps = 0.05
initial_selected_speed_mps = 0.10
max_selected_speed_mps = 0.20
speed_step_mps = 0.05
curvature_inv_m = 0.75
release_timeout_ms = 180
command_rate_hz = 20
